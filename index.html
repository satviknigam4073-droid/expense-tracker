<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Finance Tracker</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: linear-gradient(135deg, #1e3a8a, #0f172a); color: #fff; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .tracker-container { background: rgba(30, 41, 59, 0.8); backdrop-filter: blur(10px); padding: 30px; border-radius: 16px; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        h2 { text-align: center; margin-bottom: 20px; }
        .balance-box { background: #1e293b; padding: 15px; border-radius: 10px; text-align: center; margin-bottom: 20px; border: 1px solid #334155; }
        .balance-box h3 { color: #38bdf8; font-size: 28px; margin-top: 5px; }
        .input-group { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        input { padding: 12px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; outline: none; }
        button { padding: 12px; background: #0284c7; color: #fff; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background: #0369a1; }
        .history-list { list-style: none; max-height: 150px; overflow-y: auto; margin-top: 10px; }
        .history-list li { background: #1e293b; padding: 10px; border-radius: 6px; margin-bottom: 8px; display: flex; justify-content: space-between; font-size: 14px; border-left: 4px solid #ef4444; }
    </style>
</head>
<body>

    <div class="tracker-container">
        <h2>Expense Tracker</h2>
        
        <div class="balance-box">
            <p>Total Expenses</p>
            <h3>₹<span id="total-balance">0</span></h3>
        </div>

        <div class="input-group">
            <input type="text" id="expense-name" placeholder="Spent on... (e.g., Books, Food)" autocomplete="off">
            <input type="number" id="expense-amount" placeholder="Amount (₹)" autocomplete="off">
            <button id="add-btn">Add Expense</button>
        </div>

        <h4>Transaction History</h4>
        <ul id="history-list" class="history-list"></ul>
    </div>

    <script>
        let totalAmount = 0;
        document.getElementById('add-btn').addEventListener('click', function() {
            const nameInput = document.getElementById('expense-name');
            const amountInput = document.getElementById('expense-amount');
            const name = nameInput.value.trim();
            const amount = parseFloat(amountInput.value);

            if (name === "" || isNaN(amount) || amount <= 0) {
                alert("Please enter a valid description and amount!");
                return;
            }

            totalAmount += amount;
            document.getElementById('total-balance').innerText = totalAmount;

            const list = document.getElementById('history-list');
            const listItem = document.createElement('li');
            listItem.innerHTML = `<span>${name}</span> <span>₹${amount}</span>`;
            list.appendChild(listItem);

            nameInput.value = "";
            amountInput.value = "";
        });
    </script>
</body>
</html>
